name: One-time dependency refresh

on:
  push:
    branches: [feat/ai-kit-mcp-integration]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Upgrade tooling to latest stable versions
        run: |
          pnpm up --latest @biomejs/biome @types/vscode @vscode/vsce esbuild release-it typescript
          pnpm add -D '@types/node@24'
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-dependencies.yml
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): upgrade development tooling and refresh pnpm lockfile"
          git push origin HEAD:feat/ai-kit-mcp-integration
      - name: Verify upgraded toolchain
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm run package
