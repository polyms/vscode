name: Sync Node.js 26 types

on:
  push:
    branches: [feat/ai-kit-mcp-integration]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          cache: pnpm
      - name: Upgrade Node type definitions
        run: pnpm add -D '@types/node@26'
      - name: Commit refreshed lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-node-types.yml
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): align Node type definitions with Node 26"
          git push origin HEAD:feat/ai-kit-mcp-integration
